# Exemple du service frontend.
# Le fichier de référence reste le compose.yml situé à la racine du projet.

frontend:
  build:
    context: ./frontend
    dockerfile: Dockerfile
  ports:
    - "5173:5173"
  volumes:
    - ./frontend:/app
    - /app/node_modules
  environment:
    VITE_DIRECTUS_URL: "http://localhost:8055"
  depends_on:
    - directus
