services:

  database:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - cri_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped

    # Interface de test visible uniquement depuis ce PC.
    # Le port SMTP 1025 reste interne au réseau Docker.
    ports:
      - "127.0.0.1:8025:8025"

    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  directus:
    image: directus/directus:12.2.0
    restart: unless-stopped

    ports:
      - "8055:8055"

    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_healthy

    environment:
      SECRET: ${DIRECTUS_SECRET}

      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      WEBSOCKETS_ENABLED: "true"

      # URL publique de Directus. En local, elle sert aussi à construire
      # les liens sécurisés envoyés par e-mail.
      PUBLIC_URL: "${DIRECTUS_PUBLIC_URL:-http://localhost:8055}"

      # Autorise le frontend local à appeler Directus.
      CORS_ENABLED: "true"
      CORS_ORIGIN: "${CORS_ORIGIN:-array:http://localhost:5173,http://localhost:5174}"
      CORS_CREDENTIALS: "${CORS_CREDENTIALS:-true}"

      # URL du frontend utilisée par les liens de vérification et de récupération.
      FRONTEND_PUBLIC_URL: "${FRONTEND_PUBLIC_URL:-http://localhost:5173}"

      # Directus autorise le lien de réinitialisation uniquement vers cette URL.
      PASSWORD_RESET_URL_ALLOW_LIST: "${PASSWORD_RESET_URL_ALLOW_LIST:-http://localhost:5173}"

      # Auth investisseur : le refresh token reste dans un cookie httpOnly.
      # En local HTTP : secure=false. En production HTTPS : secure=true.
      REFRESH_TOKEN_COOKIE_SECURE: "${REFRESH_TOKEN_COOKIE_SECURE:-false}"
      REFRESH_TOKEN_COOKIE_SAME_SITE: "${REFRESH_TOKEN_COOKIE_SAME_SITE:-lax}"

      # E-mails de développement : Directus envoie vers Mailpit.
      # En production, ces valeurs pourront être remplacées par un SMTP réel
      # dans le fichier .env sans modifier le code.
      EMAIL_TRANSPORT: "${EMAIL_TRANSPORT:-smtp}"
      EMAIL_FROM: "${EMAIL_FROM:-no-reply@cri.local}"
      EMAIL_SMTP_HOST: "${EMAIL_SMTP_HOST:-mailpit}"
      EMAIL_SMTP_PORT: "${EMAIL_SMTP_PORT:-1025}"
      EMAIL_SMTP_USER: "${EMAIL_SMTP_USER:-}"
      EMAIL_SMTP_PASSWORD: "${EMAIL_SMTP_PASSWORD:-}"
      EMAIL_SMTP_SECURE: "${EMAIL_SMTP_SECURE:-false}"
      EMAIL_SMTP_IGNORE_TLS: "${EMAIL_SMTP_IGNORE_TLS:-true}"

      # Durée de validité d'un lien Business Plan (7 jours par défaut).
      BUSINESS_PLAN_LINK_TTL_HOURS: "${BUSINESS_PLAN_LINK_TTL_HOURS:-168}"
      CRI_CONTACT_EMAIL: "${CRI_CONTACT_EMAIL:-contact@cri.local}"
      INVESTOR_ROLE_NAME: "${INVESTOR_ROLE_NAME:-Investisseur}"
      INVESTOR_EMAIL_VERIFICATION_TTL_HOURS: "${INVESTOR_EMAIL_VERIFICATION_TTL_HOURS:-24}"

      # Limite les rafales d'e-mails de vérification/récupération en production comme en local.
      RATE_LIMITER_EMAIL_ENABLED: "${RATE_LIMITER_EMAIL_ENABLED:-true}"
      RATE_LIMITER_EMAIL_POINTS: "${RATE_LIMITER_EMAIL_POINTS:-20}"
      RATE_LIMITER_EMAIL_DURATION: "${RATE_LIMITER_EMAIL_DURATION:-60}"

    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      VITE_DIRECTUS_URL: "${DIRECTUS_PUBLIC_URL:-http://localhost:8055}"

    depends_on:
      - directus


volumes:
  cri_postgres_data:
